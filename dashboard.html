<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub - Learning Management Dashboard</title>
    <style>
        /* ============================================
           Global Styles and CSS Reset
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Color Variables */
            --primary-color: #8B5CF6;
            --primary-dark: #7C3AED;
            --primary-light: #A78BFA;
            --success-color: #F59E0B;
            --success-dark: #D97706;
            --danger-color: #EF4444;
            --danger-dark: #DC2626;
            
            /* Neutral Colors */
            --bg-color: #F9FAFB;
            --surface-color: #FFFFFF;
            --text-primary: #1F2937;
            --text-secondary: #6B7280;
            --border-color: #E5E7EB;
            
            /* Status Colors */
            --status-not-started: #94A3B8;
            --status-in-progress: #3B82F6;
            --status-completed: #10B981;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            
            /* Border Radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            
            /* Shadows */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ============================================
           Header Styles
           ============================================ */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: var(--spacing-xl) var(--spacing-md);
            box-shadow: var(--shadow-lg);
            margin-bottom: var(--spacing-xl);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: var(--spacing-sm);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        /* ============================================
           Container and Layout
           ============================================ */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--spacing-md) var(--spacing-xl);
        }

        .section {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--primary-color);
        }

        /* ============================================
           Message/Alert Styles
           ============================================ */
        .message {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-lg);
            font-weight: 500;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background-color: #D1FAE5;
            color: #065F46;
            border-left: 4px solid var(--success-color);
        }

        .message.error {
            background-color: #FEE2E2;
            color: #991B1B;
            border-left: 4px solid var(--danger-color);
        }

        .message.show {
            display: block;
        }

        /* ============================================
           Form Styles
           ============================================ */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--spacing-lg);
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .form-group label .required {
            color: var(--danger-color);
            margin-left: var(--spacing-xs);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            padding: var(--spacing-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            background-color: var(--surface-color);
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-actions {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }

        /* ============================================
           Button Styles
           ============================================ */
        .btn {
            padding: var(--spacing-md) var(--spacing-xl);
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-primary {
            background-color: #8B5CF6;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #7C3AED;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background-color: #F59E0B;
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background-color: #D97706;
        }

        .btn-danger {
            background-color: #EF4444;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background-color: #DC2626;
        }

        .btn-secondary {
            background-color: var(--text-secondary);
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: #4B5563;
        }

        .btn-sm {
            padding: var(--spacing-sm) var(--spacing-md);
            font-size: 0.875rem;
        }

        /* ============================================
           Loading Spinner
           ============================================ */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.show {
            display: flex;
        }

        .loading-content {
            background: white;
            padding: var(--spacing-xl);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--spacing-md);
        }

        .loading-spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s linear infinite;
        }

        /* ============================================
           Course Cards
           ============================================ */
        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--spacing-lg);
        }

        .course-card {
            background: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .course-card:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .course-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-color), var(--success-color));
        }

        .course-header {
            margin-bottom: var(--spacing-md);
        }

        .course-name {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .course-id {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .course-description {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
            line-height: 1.5;
        }

        .course-meta {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-md);
            padding: var(--spacing-md);
            background-color: var(--bg-color);
            border-radius: var(--radius-md);
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-size: 0.875rem;
        }

        .meta-label {
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 100px;
        }

        .meta-value {
            color: var(--text-primary);
        }

        .status-badge {
            display: inline-block;
            padding: var(--spacing-xs) var(--spacing-md);
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-not-started {
            background-color: #F1F5F9;
            color: var(--status-not-started);
        }

        .status-in-progress {
            background-color: #DBEAFE;
            color: var(--status-in-progress);
        }

        .status-completed {
            background-color: #D1FAE5;
            color: var(--status-completed);
        }

        .course-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .course-actions .btn {
            flex: 1;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl) var(--spacing-md);
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: var(--spacing-md);
        }

        .empty-state-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* ============================================
           Modal Styles
           ============================================ */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-md);
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--surface-color);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            animation: modalSlideIn 0.3s ease-out;
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--border-color);
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: var(--spacing-sm);
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* ============================================
           Statistics Bar
           ============================================ */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }

        .stat-card {
            background: var(--surface-color);
            padding: var(--spacing-lg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: var(--spacing-sm);
        }

        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* ============================================
           Responsive Design
           ============================================ */
        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .form-group.full-width {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .section {
                padding: var(--spacing-md);
            }

            .courses-grid {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h1>🎓 CodeCraftHub</h1>
            <p>Your Learning Management Platform</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Message Display -->
        <div id="message" class="message"></div>

        <!-- Statistics Bar -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-card">
                <div class="stat-value" id="totalCourses">0</div>
                <div class="stat-label">Total Courses</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="notStartedCount">0</div>
                <div class="stat-label">Not Started</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="inProgressCount">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="completedCount">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>

        <!-- Add Course Form Section -->
        <section class="section">
            <h2 class="section-title">➕ Add New Course</h2>
            <form id="addCourseForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="courseName">Course Name <span class="required">*</span></label>
                        <input type="text" id="courseName" name="name" placeholder="e.g., Python Basics" required>
                    </div>

                    <div class="form-group">
                        <label for="targetDate">Target Date <span class="required">*</span></label>
                        <input type="date" id="targetDate" name="target_date" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="courseDescription">Description <span class="required">*</span></label>
                        <textarea id="courseDescription" name="description" placeholder="What will you learn in this course?" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="courseStatus">Status <span class="required">*</span></label>
                        <select id="courseStatus" name="status" required>
                            <option value="">Select status...</option>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="addCourseBtn">
                        <span>Add Course</span>
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <span>Clear Form</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Course List Section -->
        <section class="section">
            <h2 class="section-title">📚 My Courses</h2>
            <div id="coursesContainer" class="courses-grid">
                <!-- Courses will be loaded here -->
            </div>
        </section>
    </div>

    <!-- Edit Course Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">✏️ Edit Course</h3>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <form id="editCourseForm">
                <input type="hidden" id="editCourseId">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="editCourseName">Course Name <span class="required">*</span></label>
                        <input type="text" id="editCourseName" name="name" required>
                    </div>

                    <div class="form-group">
                        <label for="editTargetDate">Target Date <span class="required">*</span></label>
                        <input type="date" id="editTargetDate" name="target_date" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="editCourseDescription">Description <span class="required">*</span></label>
                        <textarea id="editCourseDescription" name="description" required></textarea>
                    </div>

                    <div class="form-group">
                        <label for="editCourseStatus">Status <span class="required">*</span></label>
                        <select id="editCourseStatus" name="status" required>
                            <option value="Not Started">Not Started</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-success">
                        <span>Save Changes</span>
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
                        <span>Cancel</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Loading...</p>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        // ============================================
        // Configuration
        // ============================================
        const API_BASE_URL = 'http://localhost:5000';
        const API_ENDPOINTS = {
            courses: `${API_BASE_URL}/api/courses`,
            courseById: (id) => `${API_BASE_URL}/api/courses/${id}`,
            stats: `${API_BASE_URL}/api/courses/stats`
        };

        // ============================================
        // State Management
        // ============================================
        let courses = [];
        let editingCourseId = null;

        // ============================================
        // Utility Functions
        // ============================================
        
        /**
         * Show loading overlay
         */
        function showLoading() {
            document.getElementById('loadingOverlay').classList.add('show');
        }

        /**
         * Hide loading overlay
         */
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.remove('show');
        }

        /**
         * Show message to user
         */
        function showMessage(message, type = 'success') {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = `message ${type} show`;
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 5000);
        }

        /**
         * Format date for display
         */
        function formatDate(dateString) {
            const date = new Date(dateString);
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return date.toLocaleDateString('en-US', options);
        }

        /**
         * Get status badge class
         */
        function getStatusClass(status) {
            const statusMap = {
                'Not Started': 'status-not-started',
                'In Progress': 'status-in-progress',
                'Completed': 'status-completed'
            };
            return statusMap[status] || 'status-not-started';
        }

        // ============================================
        // API Functions
        // ============================================

        /**
         * Fetch all courses from API
         */
        async function fetchCourses() {
            try {
                showLoading();
                const response = await fetch(API_ENDPOINTS.courses);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.json();
                
                if (result.success) {
                    courses = result.data;
                    renderCourses();
                    await updateStatistics();
                } else {
                    throw new Error(result.message || 'Failed to fetch courses');
                }
            } catch (error) {
                console.error('Error fetching courses:', error);
                showMessage(`Error loading courses: ${error.message}`, 'error');
                renderEmptyState();
            } finally {
                hideLoading();
            }
        }

        /**
         * Create a new course
         */
        async function createCourse(courseData) {
            try {
                showLoading();
                const response = await fetch(API_ENDPOINTS.courses, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(courseData)
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Failed to create course');
                }
                
                showMessage('Course created successfully!', 'success');
                await fetchCourses(); // Refresh the list
                document.getElementById('addCourseForm').reset();
                
            } catch (error) {
                console.error('Error creating course:', error);
                showMessage(`Error creating course: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * Update a course
         */
        async function updateCourse(id, courseData) {
            try {
                showLoading();
                const response = await fetch(API_ENDPOINTS.courseById(id), {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(courseData)
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Failed to update course');
                }
                
                showMessage('Course updated successfully!', 'success');
                closeEditModal();
                await fetchCourses(); // Refresh the list
                
            } catch (error) {
                console.error('Error updating course:', error);
                showMessage(`Error updating course: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * Delete a course
         */
        async function handleDelete(id, courseName) {
            if (!confirm(`Are you sure you want to delete "${courseName}"?\n\nThis action cannot be undone.`)) {
                return;
            }
            
            try {
                showLoading();
                const response = await fetch(API_ENDPOINTS.courseById(id), {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Failed to delete course');
                }
                
                showMessage('Course deleted successfully!', 'success');
                await fetchCourses(); // Refresh the list
                
            } catch (error) {
                console.error('Error deleting course:', error);
                showMessage(`Error deleting course: ${error.message}`, 'error');
            } finally {
                hideLoading();
            }
        }

        /**
         * Fetch and update statistics
         */
        async function updateStatistics() {
            try {
                const response = await fetch(API_ENDPOINTS.stats);
                const result = await response.json();
                
                if (result.success) {
                    const stats = result.data;
                    document.getElementById('totalCourses').textContent = stats.total_courses;
                    document.getElementById('notStartedCount').textContent = stats.not_started;
                    document.getElementById('inProgressCount').textContent = stats.in_progress;
                    document.getElementById('completedCount').textContent = stats.completed;
                }
            } catch (error) {
                console.error('Error fetching statistics:', error);
            }
        }

        // ============================================
        // Rendering Functions
        // ============================================

        /**
         * Render all courses
         */
        function renderCourses() {
            const container = document.getElementById('coursesContainer');
            
            if (courses.length === 0) {
                renderEmptyState();
                return;
            }
            
            container.innerHTML = courses.map(course => `
                <div class="course-card">
                    <div class="course-header">
                        <h3 class="course-name">${escapeHtml(course.name)}</h3>
                        <span class="course-id">ID: ${course.id}</span>
                    </div>
                    
                    <p class="course-description">${escapeHtml(course.description)}</p>
                    
                    <div class="course-meta">
                        <div class="meta-item">
                            <span class="meta-label">Status:</span>
                            <span class="status-badge ${getStatusClass(course.status)}">
                                ${course.status}
                            </span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Target Date:</span>
                            <span class="meta-value">${formatDate(course.target_date)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Created:</span>
                            <span class="meta-value">${formatDate(course.created_at)}</span>
                        </div>
                    </div>
                    
                    <div class="course-actions">
                        <button class="btn btn-success btn-sm" onclick="openEditModal(${course.id})">
                            ✏️ Edit
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="handleDelete(${course.id}, '${escapeHtml(course.name)}')">
                            🗑️ Remove
                        </button>
                    </div>
                </div>
            `).join('');
        }

        /**
         * Render empty state
         */
        function renderEmptyState() {
            const container = document.getElementById('coursesContainer');
            container.innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📚</div>
                    <h3 class="empty-state-title">No Courses Yet</h3>
                    <p>Start your learning journey by adding your first course above!</p>
                </div>
            `;
        }

        /**
         * Escape HTML to prevent XSS
         */
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // Modal Functions
        // ============================================

        /**
         * Open edit modal for a course
         */
        function openEditModal(courseId) {
            const course = courses.find(c => c.id === courseId);
            if (!course) return;
            
            editingCourseId = courseId;
            
            // Populate form
            document.getElementById('editCourseId').value = course.id;
            document.getElementById('editCourseName').value = course.name;
            document.getElementById('editCourseDescription').value = course.description;
            document.getElementById('editTargetDate').value = course.target_date;
            document.getElementById('editCourseStatus').value = course.status;
            
            // Show modal
            document.getElementById('editModal').classList.add('show');
        }

        /**
         * Close edit modal
         */
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingCourseId = null;
            document.getElementById('editCourseForm').reset();
        }

        // Close modal when clicking outside
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeEditModal();
            }
        });

        // ============================================
        // Form Handlers
        // ============================================

        /**
         * Handle add course form submission
         */
        document.getElementById('addCourseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const courseData = {
                name: formData.get('name'),
                description: formData.get('description'),
                target_date: formData.get('target_date'),
                status: formData.get('status')
            };
            
            // Validate
            if (!courseData.name || !courseData.description || !courseData.target_date || !courseData.status) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            await createCourse(courseData);
        });

        /**
         * Handle edit course form submission
         */
        document.getElementById('editCourseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const courseData = {
                name: formData.get('name'),
                description: formData.get('description'),
                target_date: formData.get('target_date'),
                status: formData.get('status')
            };
            
            // Validate
            if (!courseData.name || !courseData.description || !courseData.target_date || !courseData.status) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }
            
            await updateCourse(editingCourseId, courseData);
        });

        // ============================================
        // Initialization
        // ============================================

        /**
         * Initialize the application
         */
        async function init() {
            console.log('🚀 Initializing CodeCraftHub Dashboard...');
            
            // Set default date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('targetDate').value = today;
            
            // Load courses
            await fetchCourses();
            
            console.log('✅ Dashboard initialized successfully!');
        }

        // Start the application when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        // Handle keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // ESC to close modal
            if (e.key === 'Escape' && document.getElementById('editModal').classList.contains('show')) {
                closeEditModal();
            }
        });
    </script>
</body>
</html>
